name: orderlydesk-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderlydesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderlydesk_local}
      POSTGRES_DB: ${POSTGRES_DB:-orderlydesk}
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orderlydesk]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [orderlydesk]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orderlydesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orderlydesk_local_secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orderlydesk]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orderlydesk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orderlydesk_local_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-orderlydesk-private}
    networks: [orderlydesk]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8025/livez >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orderlydesk]

networks:
  orderlydesk:

volumes:
  postgres-data:
  redis-data:
  minio-data:
